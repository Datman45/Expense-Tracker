components:
  schemas:
    authResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
        user:
          type: object
          required:
            - id
            - username
            - firstName
            - lastName
          properties:
            id:
              type: integer
            username:
              type: string
            firstName:
              type: string
            lastName:
              type: string
